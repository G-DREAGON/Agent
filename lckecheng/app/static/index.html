<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>私厨 - Personal Chief</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 class="logo">私厨</h1>
        <span class="logo-sub">Personal Chief</span>
      </div>
      <button class="btn-new-chat" id="btnNewChat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新对话
      </button>
      <div class="thread-list" id="threadList"></div>
    </aside>

    <main class="main">
      <div class="chat-header">
        <div class="chat-header-info">
          <h2 class="chat-title" id="chatTitle">新对话</h2>
        </div>
        <button class="btn-icon" id="btnClearChat" title="清空对话">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="welcome">
          <div class="welcome-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
          </div>
          <h2>欢迎使用私厨</h2>
          <p>拍一张食材照片，或者直接告诉我你有什么食材，我来帮你推荐美味食谱</p>
          <div class="quick-prompts">
            <button class="quick-prompt" data-prompt="冰箱里有鸡蛋、西红柿、青椒，能做什么菜？">冰箱里有鸡蛋、西红柿、青椒，能做什么菜？</button>
            <button class="quick-prompt" data-prompt="我有鸡胸肉和西兰花，推荐低脂食谱">我有鸡胸肉和西兰花，推荐低脂食谱</button>
            <button class="quick-prompt" data-prompt="土豆、胡萝卜、洋葱能搭配什么菜？">土豆、胡萝卜、洋葱能搭配什么菜？</button>
          </div>
        </div>
      </div>

      <div class="chat-input-area">
        <div class="image-preview" id="imagePreview" style="display:none">
          <img id="previewImg" src="" alt="预览" />
          <button class="btn-remove-image" id="btnRemoveImage" title="移除图片">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="input-row">
          <button class="btn-upload" id="btnUpload" title="上传食材照片">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
          <input type="file" id="fileInput" accept="image/*" style="display:none" />
          <textarea
            id="chatInput"
            class="chat-input"
            placeholder="输入食材或描述你想吃的菜..."
            rows="1"
          ></textarea>
          <button class="btn-send" id="btnSend" title="发送">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <input type="hidden" id="currentImageUrl" value="" />
        <div class="upload-status" id="uploadStatus" style="display:none"></div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
